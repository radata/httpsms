server {
  listen 3000;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html index.htm;

  # MUST STAY OFF. `nuxt generate` writes every route as a DIRECTORY
  absolute_redirect off;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # CUSTOM: the Android APK, published as a download.
  #
  # The directory is BIND-MOUNTED in (docker-compose.yml), never baked into the
  # image. Same reason the config is substituted at container start: one image
  # runs in dev and in production, and shipping a new build of the app must not
  # mean rebuilding and redeploying the web.
  #
  # THIS BLOCK EXISTS TO DEFEAT THE FALLBACK ABOVE. `try_files ... /index.html`
  # answers EVERY unmatched path with the SPA and a 200, so a missing apk is
  # downloaded as a few KB of HTML named HttpSms.apk. The phone then rejects it
  # as an invalid package, and nothing anywhere says the file was simply absent
  # — not the status code, not the log line. `=404` makes it say so.
  location /downloads/ {
    # No `alias`. root is inherited from the server block, so this resolves to
    # /usr/share/nginx/html/downloads/ on its own, and `try_files $uri` behaves
    # predictably — which it notoriously does not inside an aliased location.
    try_files $uri =404;

    # nginx's mime.types has no entry for .apk, so it would go out as
    # application/octet-stream. Android's package installer reads this type when
    # the file arrives from a browser.
    #
    # A `types` block REPLACES the inherited map for this location rather than
    # extending it, so the checksum has to be named here too or it downloads as
    # a binary blob instead of showing in the browser.
    types {
      application/vnd.android.package-archive  apk;
      text/plain                               sha256;
    }
    default_type application/octet-stream;

    # The apk is REPLACED IN PLACE under a stable name, so a cached copy is a
    # stale build. That is how a phone installs last week's app and someone
    # reports a bug that was fixed on Tuesday.
    add_header Cache-Control 'no-store' always;
  }
}
