# ONE number. Bump it before every release build / Play upload.
#
# It is both the versionCode and the versionName, so 1, 2, 3, 4, 5 ... and
# nothing else to keep in sync. Play shows it as "2 (2)".
#
# versionCode must increase on every Play upload - Play rejects a re-used or
# lower value permanently - and Android refuses to install an update whose
# versionCode is lower than the installed one, so this matters for sideloading
# too. It is also the trailing segment of the tester URL:
#   https://play.google.com/apps/test/nl.hollandworx.sms/<versionCode>
#
# versionName reaches the backend as the client-version header on every API
# call (HttpSmsApiService) and appears in Logz, so bumping it is what makes a
# release identifiable in server logs.
versionCode=3
